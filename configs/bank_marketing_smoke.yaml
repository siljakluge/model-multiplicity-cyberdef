experiment_name: bank_marketing_smoke_seed{origin_seed}
run_dir: runs/bank_marketing_smoke_seed{origin_seed}
dataset: {name: bank_marketing, raw_dir: data/raw/bank-marketing, test_size: 0.2, validation_size: 0.2, split_seed: 42}
training:
  design: factorized
  origin_seed: 1
  seed_schedule: origin_disjoint
  seed_namespace: 100000
  comparison_seeds: [2]
  subset_fractions: [1.0]
  factorized_subset_fraction: 1.0
  hidden_dims: [16]
  hidden_dims_variants: [[16]]
  architecture_variants: [[16]]
  activation: relu
  activation_variants: [relu]
  epochs: 1
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.1
  patience: 1
  device: auto
